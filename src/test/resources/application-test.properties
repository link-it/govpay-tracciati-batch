# Profilo di test: contesto Spring su H2 in-memory (nessun job eseguito).
spring.main.web-application-type=none

spring.datasource.url=jdbc:h2:mem:tracciatitest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JobRepository: crea le tabelle BATCH_* su H2 per il context load
spring.batch.jdbc.initialize-schema=embedded
spring.batch.job.enabled=false
