# Profilo di sviluppo locale: batch puro (nessun web server), datasource GovPay locale.

spring.main.web-application-type=none

# Datasource GovPay (schema condiviso: tracciati/operazioni/versamenti/stampe + tabelle BATCH_*)
spring.datasource.url=jdbc:postgresql://localhost:5432/govpay
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=govpay
spring.datasource.password=govpay
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

govpay.batch.cluster-id=GovPay-Tracciati-Batch-Local

logging.level.it.govpay.tracciati.batch=DEBUG
