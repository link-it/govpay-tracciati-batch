spring.application.name=govpay-tracciati-batch
spring.main.banner-mode=off

# Jackson
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Europe/Rome

# Spring Batch: nessuna esecuzione automatica al boot (avvio via scheduler/cron/controller)
spring.batch.job.enabled=false

# ── Batch (prefix govpay.batch, mappato da BatchProperties) ─────────────
govpay.batch.enabled=true
govpay.batch.time-zone=Europe/Rome
# Identita del nodo per il coordinamento multi-nodo (lock su tabelle BATCH_*)
govpay.batch.cluster-id=GovPay-Tracciati-Batch
# Soglia (minuti) oltre la quale un'esecuzione e considerata stale e recuperabile
govpay.batch.stale-threshold-minutes=120

# Parallelismo interno (partizionamento step)
govpay.batch.thread-pool-size=10
# Chunk / lotti per thread (allineati ai default della vecchia procedura)
govpay.batch.caricamento-chunk-size=100
govpay.batch.stampe-chunk-size=100
# Scrittura di tracciati.zip_stampe: AUTO (dedotta dal vendor del DB), LARGE_OBJECT (OID PostgreSQL), BLOB
govpay.batch.modalita-zip-stampe=AUTO

# ── Microservizio stampe (govpay-stampe-api) ────────────────────────────
govpay.tracciati.stampe.base-url=
# Timeout di default (ms) delle chiamate al microservizio stampe (nessuna autenticazione)
govpay.tracciati.stampe.connect-timeout-ms=10000
govpay.tracciati.stampe.read-timeout-ms=60000

# Logo dell'ente usato quando il dominio non ne ha uno: e' il TESTO del data URI, come lo conserva
# GovPay in domini.logo (il servizio di stampa lo passa al template cosi' com'e').
# Valore di default: PNG 1x1 trasparente, cioe' avviso senza logo come nel vecchio GovPay.
govpay.tracciati.stampe.logo.default=data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAACklEQVR4nGMAAQAABQABDQottAAAAABJRU5ErkJggg==
# Giorni di validita' da sommare alla data di creazione quando la pendenza non ha data di validita'
# ne' di scadenza (legacy: it.govpay.modello3.sanp24.giorniValiditaDaAssegnarePendenzaSenzaDataValidita)
govpay.tracciati.stampe.giorni-validita-pendenza=

# ── Scheduler interno ───────────────────────────────────────────────────
scheduler.elaborazioneTracciatiPendenzeJob.fixedDelayString=60000
scheduler.initialDelayString=1

# ── Actuator ────────────────────────────────────────────────────────────
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.health.db.enabled=true
management.metrics.tags.application=govpay-tracciati-batch
